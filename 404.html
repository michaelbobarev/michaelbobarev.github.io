<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="robots" content="noindex, nofollow">
    
    <title>404: Not Found | Михаил Бобарев</title>
    
    <!-- Иконки для веба и Apple устройств -->
    <link rel="icon" type="image/png" sizes="192x192" href="https://www.bobarev.com/favicon.png">
    <link rel="apple-touch-icon" href="https://www.bobarev.com/favicon.png">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            font-family: ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace !important;
            font-size: 15px;
            line-height: 1.5;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .prompt {
            color: #4af626; /* Terminal green */
            font-weight: bold;
        }
        .cmd {
            color: #ffffff;
        }
        .error {
            color: #ff4d4d; /* Terminal red */
        }
        a {
            color: #3b8eea; /* Terminal blue */
            text-decoration: none;
            display: inline-block;
            padding: 2px 0;
        }
        a:hover {
            color: #ffffff;
            background-color: #3b8eea;
        }
        p {
            margin: 0 0 24px 0;
            line-height: 1.8;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 15px;
            }
            *, *::before, *::after {
                font-size: 13.5px;
            }
        }
    </style>
</head>
<body>
    <main class="container" role="main">
        <div>
            <span class="prompt">michael@bobarev-com:~#</span> <span class="cmd">cat 404.txt</span>
        </div>
        <p class="error">Ошибка 404: страница не найдена</p>
        <p>Такой страницы на сайте нет — возможно, в адресе опечатка или ссылка устарела.</p>

        <div>
            <span class="prompt">michael@bobarev-com:~#</span> <span class="cmd">cd ~</span>
        </div>
        <p><a href="/">Вернуться домой | Back to home</a></p>
    </main>
</body>
</html>
